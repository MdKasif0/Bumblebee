<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumblebee - LCD Animation Recreation</title>
  <meta name="description" content="100% programmatic procedural recreation of the Bumblebee 128x64 LCD cartoon animation synchronized to master audio clock.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="animation-stage">
    <!-- Active logical 128x64 display canvas -->
    <canvas id="display-canvas" width="512" height="256"></canvas>
    <!-- Authentic subtle LCD dot matrix texture -->
    <div class="lcd-pixel-grid-overlay" id="pixel-overlay"></div>
  </main>

  <!-- Audio Element (master audio clock) -->
  <audio id="audio-master" preload="auto" playsinline autoplay>
    <source src="assets/audio.mp3" type="audio/mp3">
  </audio>

  <!-- ES Modules -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
