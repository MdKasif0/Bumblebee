<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumblebee - OLED Animation Recreation</title>
  <meta name="description" content="Frame-accurate programmatic recreation of the Bumblebee 128x64 OLED animation synchronized to master audio clock.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-branding">
        <div class="badge-tag">STEP 1 / 5 FOUNDATION</div>
        <h1 class="app-title">Bumblebee <span>OLED Recreation</span></h1>
      </div>
      <div class="header-meta">
        <div class="pill-stat">
          <span class="pill-dot"></span>
          <span id="fps-counter">60 FPS</span>
        </div>
        <div class="pill-stat">
          <span class="pill-label">MATRIX</span>
          <span class="pill-value">128 × 64</span>
        </div>
        <div class="pill-stat">
          <span class="pill-label">SYNC</span>
          <span class="pill-value" id="sync-status">AUDIO MASTER</span>
        </div>
      </div>
    </header>

    <!-- Main Stage -->
    <main class="stage-container">
      <div class="device-wrapper">
        <!-- Physical Breakout Board (SSD1306 0.96" OLED Module Style) -->
        <div class="oled-pcb-board" id="pcb-board">
          <!-- Mounting holes -->
          <div class="mounting-hole hole-tl"></div>
          <div class="mounting-hole hole-tr"></div>
          <div class="mounting-hole hole-bl"></div>
          <div class="mounting-hole hole-br"></div>

          <!-- Header Pin Labels -->
          <div class="pin-header-group">
            <div class="pin-marker">
              <span class="pin-num">1</span>
              <div class="pin-solder"></div>
              <span class="pin-label">GND</span>
            </div>
            <div class="pin-marker">
              <span class="pin-num">2</span>
              <div class="pin-solder"></div>
              <span class="pin-label">VDD</span>
            </div>
            <div class="pin-marker">
              <span class="pin-num">3</span>
              <div class="pin-solder"></div>
              <span class="pin-label">SCK</span>
            </div>
            <div class="pin-marker">
              <span class="pin-num">4</span>
              <div class="pin-solder"></div>
              <span class="pin-label">SDA</span>
            </div>
          </div>

          <!-- Screen Outer Bezel -->
          <div class="oled-glass-bezel">
            <div class="oled-screen-viewport">
              <!-- Active logical 128x64 display canvas -->
              <canvas id="display-canvas" width="512" height="256"></canvas>
              <!-- CRT / Scanline / Pixel Grid Overlay -->
              <div class="pixel-matrix-overlay" id="pixel-overlay"></div>
              <div class="glass-glare-overlay"></div>
            </div>
            <div class="bezel-bottom-tab">
              <span class="bezel-marking">SSD1306 128x64 OLED</span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- HUD & Player Controls -->
    <footer class="app-footer">
      <div class="hud-panel">
        <!-- Current Scene & Lyric Live Banner -->
        <div class="scene-banner">
          <div class="scene-id-pill" id="current-scene-id">SCENE 01 / 26</div>
          <div class="scene-lyric-preview" id="current-lyric-display">Intro Beat</div>
          <div class="scene-timing-info" id="current-scene-timing">0.00s - 0.67s</div>
        </div>

        <!-- Scrubber & Time -->
        <div class="scrubber-row">
          <span class="time-readout" id="current-time-display">00:00.00</span>
          <div class="timeline-slider-track" id="slider-track-container">
            <input type="range" id="timeline-slider" min="0" max="31.87" step="0.01" value="0" aria-label="Playback timeline scrubber">
            <div class="scene-markers-overlay" id="scene-markers"></div>
          </div>
          <span class="time-readout" id="total-time-display">00:31.87</span>
        </div>

        <!-- Action Controls -->
        <div class="control-actions-row">
          <div class="action-group-left">
            <button id="btn-play-pause" class="btn-primary" aria-label="Play or pause animation">
              <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
              <span id="play-pause-label">Play</span>
            </button>
            <button id="btn-restart" class="btn-secondary" title="Restart from beginning (Home)">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              </svg>
              <span>Restart</span>
            </button>
            <button id="btn-prev-scene" class="btn-icon" title="Previous Scene (Left Arrow)">⏮</button>
            <button id="btn-next-scene" class="btn-icon" title="Next Scene (Right Arrow)">⏭</button>
          </div>

          <div class="action-group-right">
            <!-- Palette Selector -->
            <div class="select-group">
              <label for="palette-select">Display Mode:</label>
              <select id="palette-select">
                <option value="oled-blue" selected>OLED Pale Blue (Original)</option>
                <option value="oled-white">OLED Crisp White</option>
                <option value="amber-phosphor">Amber CRT / Retro</option>
                <option value="matrix-green">Matrix Green</option>
                <option value="inverted">Inverted Dark Mode</option>
              </select>
            </div>

            <!-- Speed Selector -->
            <div class="select-group">
              <label for="speed-select">Speed:</label>
              <select id="speed-select">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="1.0" selected>1.0×</option>
              </select>
            </div>

            <!-- Volume Control -->
            <button id="btn-mute" class="btn-icon" title="Mute/Unmute Audio">
              <span id="mute-icon">🔊</span>
            </button>

            <!-- Fullscreen -->
            <button id="btn-fullscreen" class="btn-icon" title="Toggle Fullscreen">⛶</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Audio Element (master audio clock) -->
  <audio id="audio-master" preload="auto">
    <source src="assets/audio.mp3" type="audio/mp3">
  </audio>

  <!-- ES Modules -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
