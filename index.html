<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Little Bumblebee — LCD Hand-Drawn Animation</title>
  <meta name="description" content="Authentic real-time browser reconstruction of the 128x64 LCD hand-drawn pixel animation synced to Sweet Little Bumblebee.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="badge-tag">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
          <circle cx="4" cy="4" r="4"/>
        </svg>
        128x64 Monochrome LCD Reconstruction
      </div>
      <h1 class="title">Sweet Little Bumblebee</h1>
      <p class="subtitle">Hand-drawn pixel animation synchronized live to the audio reference</p>
    </header>

    <!-- Audio Element -->
    <audio id="audio-track" src="audio.mp3" preload="auto"></audio>

    <!-- Viewport Card -->
    <div class="viewport-card">
      <div id="display-wrapper" class="display-wrapper">
        <canvas id="lcd-canvas" width="256" height="128"></canvas>

        <!-- Click to Start / Ready Overlay -->
        <div id="start-overlay" class="start-overlay loading">
          <div class="overlay-play-circle">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
          <div class="overlay-text">Click to Play Animation</div>
          <div class="loading-bar-container">
            <div id="loading-progress" class="loading-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Control Dock -->
    <div class="control-dock">
      <!-- Timeline Row -->
      <div class="scrubber-row">
        <input type="range" id="scrubber" class="scrubber-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek time">
        <div id="time-display" class="time-display">00:00 / 00:31</div>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <div class="action-group">
          <!-- Play / Pause -->
          <button id="play-btn" class="btn-icon primary" aria-label="Play / Pause">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- Volume & Mute -->
          <div class="volume-control">
            <button id="mute-btn" class="btn-icon" aria-label="Mute">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.9" aria-label="Volume">
          </div>
        </div>

        <!-- Display Toggles -->
        <div class="action-group">
          <div class="toggle-group">
            <label class="toggle-label">
              <input type="checkbox" id="grid-toggle">
              <span>LCD Matrix Grid</span>
            </label>
            <label class="toggle-label">
              <input type="checkbox" id="bezel-toggle">
              <span>Hardware Bezel Mode</span>
            </label>
          </div>

          <!-- Fullscreen -->
          <button id="fullscreen-btn" class="btn-icon" aria-label="Toggle Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Scene Jump Navigation -->
    <div class="scene-jumps-card">
      <div class="section-label">Scene Navigation / Chapter Jumps</div>
      <div id="scene-list" class="scene-pills-container">
        <!-- Dynamically generated scene pills -->
      </div>
    </div>

    <!-- Keyboard Shortcuts -->
    <div class="keyboard-hints">
      <span><span class="kbd">Space</span> Play / Pause</span>
      <span><span class="kbd">←</span> <span class="kbd">→</span> Seek 2s</span>
      <span><span class="kbd">M</span> Mute</span>
      <span><span class="kbd">F</span> Fullscreen</span>
    </div>
  </div>

  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
